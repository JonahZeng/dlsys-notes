# Workflow for building and deploying an mdBook site to GitHub Pages
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
# Mermaid diagrams are handled by the mdbook-mermaid preprocessor:
# https://github.com/badboy/mdbook-mermaid
name: Deploy mdBook site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.4
      MDBOOK_MERMAID_VERSION: 0.17.1
      # Must match the runner's architecture; ubuntu-latest is x86_64.
      BINARY_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook and mdbook-mermaid
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSLo /tmp/mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-${BINARY_TARGET}.tar.gz"
          curl -sSLo /tmp/mdbook-mermaid.tar.gz \
            "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-${BINARY_TARGET}.tar.gz"
          tar -xzf /tmp/mdbook.tar.gz -C "$HOME/.local/bin"
          tar -xzf /tmp/mdbook-mermaid.tar.gz -C "$HOME/.local/bin"
          # GITHUB_PATH only applies to later steps, so export for the checks below too.
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mdbook --version
          mdbook-mermaid --version
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install mermaid assets
        # mermaid.min.js and mermaid-init.js are git-ignored (*.js in .gitignore),
        # so they are absent from a fresh checkout and must be regenerated here.
        run: mdbook-mermaid install .
      - name: Build with mdBook
        run: mdbook build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./book

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
