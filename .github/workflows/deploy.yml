name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook (latest release, Linux x86_64-unknown-linux-gnu)
        run: |
          URL=$(
            curl -s https://api.github.com/repos/rust-lang/mdBook/releases/latest \
            | jq -r '.assets[]
              | select(.name | endswith("x86_64-unknown-linux-gnu.tar.gz"))
            .browser_download_url'
          )
          echo "Downloading $URL"
          curl -sSL "$URL" | tar -xz -C $HOME/.cargo/bin


      - name: Build book
        run: mdbook build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
